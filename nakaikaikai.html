<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>本郷TC - NAKAIKAI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&family=Montserrat:wght@300;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Montserrat', 'Noto Serif JP', serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .text-gradient {
            background: linear-gradient(to right, #f1f5f9, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .nav-link {
            transition: all 0.3s ease;
            position: relative;
        }
        .nav-link::after {
            content: '';
            position: absolute;
            width: 0;
            height: 1px;
            bottom: -2px;
            left: 0;
            background-color: #94a3b8;
            transition: width 0.3s ease;
        }
        .nav-link:hover::after {
            width: 100%;
        }
        .animate-fade-in {
            animation: fadeIn 1.5s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="p-6">

    <nav class="fixed top-0 w-full p-8 flex justify-center space-x-12 text-sm tracking-widest uppercase opacity-80">
        <a href="elements/本郷TC会則.html" class="nav-link hover:text-white">会則</a>
        <a href="elements/MVP.html" class="nav-link hover:text-white">NVP</a>
    </nav>

    <main class="glass-card max-w-3xl w-full p-12 md:p-20 rounded-2xl text-center animate-fade-in">
        <h1 class="text-4xl md:text-6xl font-light mb-8 tracking-tighter italic text-gradient">
            "本郷TC" <span class="text-xl md:text-2xl block mt-2 opacity-50 not-italic">established in 〇〇</span>
        </h1>
        
        <div class="w-12 h-px bg-slate-500 mx-auto mb-12 opacity-30"></div>
        
        <p class="text-lg md:text-xl leading-relaxed font-light italic text-slate-300 mb-16">
            「夜明けが告げる新たな始まり。<br class="hidden md:block">
            一人ひとりの輝きが交錯し、一週間を彩る活力が生まれる。<br class="hidden md:block">
            "NAKAIKAI"、それは人生を豊かにする。」
        </p>

        <div class="flex flex-col items-center">
            <a href="https://www.youtube.com/watch?v=SeJjUEhXZ7c&t=49s" 
               class="group flex items-center space-x-4 bg-white/5 hover:bg-white/10 px-8 py-4 rounded-full border border-white/10 transition-all duration-300">
                <span class="text-sm tracking-widest uppercase opacity-70 group-hover:opacity-100">2508中井会</span>
                <svg class="w-5 h-5 text-red-500 group-hover:scale-110 transition-transform" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M19.615 3.184c-3.604-.246-11.631-.245-15.23 0-3.897.266-4.356 2.62-4.385 8.816.029 6.185.484 8.549 4.385 8.816 3.6.245 11.626.246 15.23 0 3.897-.266 4.356-2.62 4.385-8.816-.029-6.185-.484-8.549-4.385-8.816zm-10.615 12.816v-8l8 3.993-8 4.007z"/>
                </svg>
            </a>
        </div>
    </main>

    <footer class="fixed bottom-8 text-[10px] tracking-[0.3em] uppercase opacity-30">
        &copy; 2026 HONGO TC / NAKAIKAI
    </footer>

</body>
</html>
